name: VoxGuard verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU verification dependencies
        run: |
          python -m pip install uv
          uv pip install --system --torch-backend cpu -r requirements.txt pytest httpx2
          ffmpeg -version | head -1
      - name: Run API tests and model smoke with repository demo audio
        env:
          VOXGUARD_RUN_MODEL_TEST: "1"
          OMP_NUM_THREADS: "2"
        run: python -m pytest -q
